[project]
name = "ffmpeg"
version = "1.0.0"
description = "FFmpeg — convert, transcode, compress, cut, extract, and filter any media on your phone. Powered by FFmpeg 8 via PyAV."
readme = "README.md"
requires-python = ">=3.14"
# These packages are audited against one exact Flet/PyAV wire contract.
# Keep the pins synchronized with uv.lock and pinned-deps.txt; a minor
# framework release can change component constructors and event semantics.
dependencies = [
    "av==18.1.0",
    "flet==1.0.3",
    "flet-ads==1.0.3",
    "flet-audio==1.0.3",
    "flet-audio-recorder==1.0.3",
    "flet-camera==1.0.3",
    "flet-permission-handler==1.0.3",
    "flet-video==1.0.3",
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "flet-cli==1.0.3",
    "flet-desktop==1.0.3",
    "pytest==9.1.1",
    "ruff==0.16.8",
]

[tool.uv]
package = false

# ── Flet 1.0 build config (flet-cli–consumed; keys verified against
# ── flet.dev/docs/publish/ + sibling apps. Brand primary = FFmpeg green
# ── #3c8038 (the launcher glyph); backgrounds are Kiri slate for contrast.
[tool.flet]
org = "ng.kiri"
product = "FFmpeg Lite"
company = "Kiri Research Labs"
build_number = 1
icon_background = "#0f1114"
desktop_flavor = "full"
# Cross-platform groups add matching iOS usage descriptions/entitlements;
# Android's explicit permission table below remains intact.
permissions = ["camera", "microphone"]

[tool.flet.app]
path = "src"

# flet-cli reads the built-in screen as { name = "flet", flet = { ... } }.
[tool.flet.boot_screen]
name = "flet"
flet = { startup_message = "Initializing FFmpeg Lite..." }

[tool.flet.splash]
color = "#ffffff"
dark_color = "#0f1114"

# Android reads deep links from the ANDROID block only; a top-level
# [tool.flet.deep_linking] is ignored for the APK.
[tool.flet.android.deep_linking]
scheme = "ffmpeg"
host = "app"

[tool.flet.android]
bundle_id = "ng.kiri.ffmpeg"
split_per_abi = true
# PyAV loads bundled FFmpeg shared libraries through package paths; keep its
# native extension unpacked instead of relying on zipimport layout.
extract_packages = ["av"]
# All three ABIs: Flet's bundled Python manifest publishes arm64/x86_64/
# armeabi-v7a, and the Mobile Forge `av` index ships Android 24 wheels for all
# three. `--split-per-abi` gives Play one device APK plus an emulator/QA APK
# instead of a fat universal package. The earlier arm64-only pin was copied
# from a sibling app's emulator-split note, not derived from a dependency
# failure in this project.
target_arch = ["arm64-v8a", "x86_64", "armeabi-v7a"]
# NOTE: `min_sdk_version` is NOT a flet-cli key (zero references in its
# source) — av's wheels are built at ABI 24; the effective floor comes from
# the Flutter/Gradle template, so verify the generated minSdk before tagging.
# `manifest_application.usesCleartextTraffic` is likewise NOT merged (only
# permission/feature/meta_data/provider are) — http:// capture depends on the
# platform default, so test it on-device before advertising plain-http input.
adaptive_icon_background = "#0f1114"

[tool.flet.android.meta_data]
# Production AdMob App ID (matches ADMOB_APP_ID_PROD in src/core/constants.py
# with AdService USE_TEST_IDS=False — live ads on every build including tags).
"com.google.android.gms.ads.APPLICATION_ID" = "ca-app-pub-5679949845754640~8554716742"

# Play-safe set: media INPUTS come from the SAF system picker (no permission),
# OUTPUTS go to a user-chosen location via SAF/MediaStore (no permission). Only
# in-app capture (camera/mic) and audio playback tuning need grants. No broad
# storage/media-read permissions are declared (Play rejects them when SAF suffices).
[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.ACCESS_NETWORK_STATE" = true
"android.permission.WAKE_LOCK" = true
"android.permission.CAMERA" = true
"android.permission.RECORD_AUDIO" = true
"android.permission.MODIFY_AUDIO_SETTINGS" = true

[tool.flet.android.feature]
"android.software.leanback" = false
"android.hardware.touchscreen" = true

# Signing credentials are supplied only through FLET_ANDROID_SIGNING_* env or
# CLI flags; never commit a machine-relative keystore path.

# flet-cli's Android template defaults to org.gradle.jvmargs=-Xmx8G (+4G
# metaspace) — more than a 7 GB GitHub runner has, so CI builds OOM. Merged
# over the defaults; only the memory line is overridden.
[tool.flet.android.gradle_properties]
"org.gradle.jvmargs" = "-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError"

# Ship runtime code only: dev/test artifacts are stripped at package time.
# Setting app_files also implies cleanup.app = true (verified in flet-cli).
[tool.flet.cleanup]
app_files = [
    "tests",
    "docs",
    "screenshots",
    "README.md",
    "ui-spike",
    "src/ui-spike",
]

# Upstream workaround for Flet <= 1.0.3 until 1.0.4 ships (Flet PR #6920):
# Flet's template pins jni: 1.0.0, but on 2026-10-06 pub.dev released
# jni_flutter 1.0.4+1 which enforces package:jni ^1.1.0 via JniVersionCheck.
[tool.flet.flutter.pubspec.dependency_overrides]
jni = "^1.1.0"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["-ra", "-q"]
strict_markers = true
strict_config = true
markers = [
    "live: hits the real network; run explicitly with -m live",
]
filterwarnings = [
    # Escalate warnings from our modules; leave third-party warnings visible.
    "error:::^(services|screens|components|core|state|tests)(\\.|/)|^(app_shell|main)$",
]

[tool.ruff]
line-length = 100
# Keep formatter output importable by the Flet verifier/runtime as well as
# Python 3.14; the app itself still requires Python 3.14.
target-version = "py313"

[tool.ruff.lint]
# B/SIM/PERF/RUF/ASYNC/PTH/TRY added M3 (measured: 186 hits → driven to 0).
# TRY003/TRY300 kept out for house style (long raise-messages; try/else shape).
# BLE/S deliberately absent: broad-except + assert-in-tests are house rules.
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "SIM",
    "PERF",
    "RUF",
    "ASYNC",
    "PTH",
    "TRY",
]
ignore = ["E501", "TRY003", "TRY300"]
