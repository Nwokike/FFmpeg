[project]
name = "ffmpeg"
version = "2.0.0"
description = "FFmpeg — convert, transcode, compress, cut, extract, and filter any media on your phone. Powered by FFmpeg via PyAV."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "av>=19.0.2",
    "flet>=1.1.2",
    "flet-ads>=1.1.2",
    "flet-audio>=1.1.2",
    "flet-audio-recorder>=1.1.2",
    "flet-camera>=1.1.2",
    "flet-permission-handler>=1.1.2",
    "flet-video>=1.1.2",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "flet-cli>=1.1.2",
    "flet-desktop>=1.1.2",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.uv]
package = false

[tool.flet]
org = "ng.kiri"
product = "FFmpeg AV"
company = "Kiri Research Labs"
build_number = 2
desktop_flavor = "full"
# Cross-platform groups add matching iOS usage descriptions/entitlements;
# Android's explicit permission table below remains intact.
permissions = ["camera", "microphone"]

[tool.flet.app]
path = "src"

# flet-cli reads the built-in screen as { name = "flet", flet = { ... } }.
[tool.flet.boot_screen]
name = "flet"
flet = { startup_message = "Initializing FFmpeg AV..." }

[tool.flet.splash]
color = "#ffffff"
dark_color = "#0f1114"

# Android reads deep links from the ANDROID block only; a top-level
# [tool.flet.deep_linking] is ignored for the APK.
[tool.flet.android.deep_linking]
scheme = "ffmpeg"
host = "app"

[tool.flet.android]
bundle_id = "ng.kiri.ffmpeg"
split_per_abi = true
extract_packages = ["av"]
target_arch = ["arm64-v8a", "x86_64", "armeabi-v7a"]

[tool.flet.android.meta_data]
# Production AdMob App ID (matches ADMOB_APP_ID_PROD in src/core/constants.py
# with AdService USE_TEST_IDS=False — live ads on every build including tags).
"com.google.android.gms.ads.APPLICATION_ID" = "ca-app-pub-5679949845754640~8554716742"

# Play-safe set: media INPUTS come from the SAF system picker (no permission),
# OUTPUTS go to a user-chosen location via SAF/MediaStore (no permission). Only
# in-app capture (camera/mic) and audio playback tuning need grants. No broad
# storage/media-read permissions are declared (Play rejects them when SAF suffices).
[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.ACCESS_NETWORK_STATE" = true
"android.permission.WAKE_LOCK" = true
"android.permission.CAMERA" = true
"android.permission.RECORD_AUDIO" = true
"android.permission.MODIFY_AUDIO_SETTINGS" = true

[tool.flet.android.feature]
"android.software.leanback" = false
"android.hardware.touchscreen" = true

# Signing credentials are supplied only through FLET_ANDROID_SIGNING_* env or
# CLI flags; never commit a machine-relative keystore path.

# flet-cli's Android template defaults to org.gradle.jvmargs=-Xmx8G (+4G
# metaspace) — more than a 7 GB GitHub runner has, so CI builds OOM. Merged
# over the defaults; only the memory line is overridden.
[tool.flet.android.gradle_properties]
"org.gradle.jvmargs" = "-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError"

# Ship runtime code only: dev/test artifacts are stripped at package time.
# Setting app_files also implies cleanup.app = true (verified in flet-cli).
[tool.flet.cleanup]
app_files = [
    "tests",
    "docs",
    "screenshots",
    "README.md",
    "ui-spike",
    "src/ui-spike",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["-ra", "-q"]
strict_markers = true
strict_config = true
markers = [
    "live: hits the real network; run explicitly with -m live",
]
filterwarnings = [
    # Escalate warnings from our modules; leave third-party warnings visible.
    "error:::^(services|screens|components|core|state|tests)(\\.|/)|^(app_shell|main)$",
]

[tool.ruff]
line-length = 100
# Keep formatter output importable by the Flet verifier/runtime as well as
# Python 3.14; the app itself still requires Python 3.14.
target-version = "py313"

[tool.ruff.lint]
# B/SIM/PERF/RUF/ASYNC/PTH/TRY added M3 (measured: 186 hits → driven to 0).
# TRY003/TRY300 kept out for house style (long raise-messages; try/else shape).
# BLE/S deliberately absent: broad-except + assert-in-tests are house rules.
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "SIM",
    "PERF",
    "RUF",
    "ASYNC",
    "PTH",
    "TRY",
]
ignore = ["E501", "TRY003", "TRY300"]
