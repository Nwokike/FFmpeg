name: Build Multi-Platform & Create Release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      build_version:
        description: "Build version"
        required: true
        default: "1.0.0"
      build_number:
        description: "Build number"
        required: true
        default: "1"

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  FLET_CLI_NO_RICH_OUTPUT: "1"
  UV_PYTHON: "3.14"
  BUILD_VERSION: ${{ inputs.build_version || '1.0.0' }}
  BUILD_NUMBER: ${{ inputs.build_number || '1' }}

jobs:
  # ─── Q. Quality gate: lint + tests (blocks every build) ───────────────
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies (incl. dev group)
        run: uv sync --frozen
      - name: Ruff
        run: uv run --frozen ruff check .
      - name: Ruff format
        run: uv run --frozen ruff format --check .
      - name: Tests (offline only)
        run: uv run --frozen pytest -m "not live" -q
      - name: Release identity consistency
        run: |
          uv run --frozen python - <<'PY'
          import json, os, sys, tomllib
          py = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          felb = str(tomllib.load(open("pyproject.toml", "rb"))["tool"]["flet"]["build_number"])
          sys.path.insert(0, "src")
          from core.constants import BUILD_NUMBER, APP_VERSION

          vj = json.load(open("version.json"))
          env_v = os.environ.get("BUILD_VERSION", py)
          env_b = str(os.environ.get("BUILD_NUMBER", felb))
          errs = []

          if env_v != py:
              errs.append(f"BUILD_VERSION {env_v!r} != pyproject {py!r}")
          if APP_VERSION != py:
              errs.append(f"core.constants.APP_VERSION {APP_VERSION!r} != pyproject {py!r}")
          if str(BUILD_NUMBER) != env_b:
              errs.append(f"core.constants.BUILD_NUMBER {BUILD_NUMBER} != BUILD_NUMBER {env_b}")
          if felb != env_b:
              errs.append(f"tool.flet.build_number {felb} != BUILD_NUMBER {env_b}")

          def vt(s):
              return tuple(int(x) for x in s.split("."))

          vj_v = vj["version"]
          if vj_v == py:
              if str(vj["build_number"]) != env_b:
                  errs.append(f"version.json synced to {vj_v} but build_number != {env_b}")
              else:
                  print(f"versions synced: {py} (build {env_b})")
          elif vt(vj_v) < vt(py):
              print(f"NOTICE: version.json held back at {vj_v}")
          else:
              errs.append(f"version.json {vj_v} is ahead of pyproject {py}")

          if errs:
              print("Version drift:", file=sys.stderr)
              print("\n".join(f"  - {e}" for e in errs), file=sys.stderr)
              sys.exit(1)
          PY
      - name: AdMob production ID guard
        run: |
          set -euo pipefail
          fail=0
          # Manifest App ID must be prod (test IDs live in constants.py ONLY
          # as the *_TEST fallback values — their presence there is by design).
          if grep -q "3940256099942544" pyproject.toml 2>/dev/null; then
            echo "::error::Google test AdMob App ID in pyproject.toml. Put the production App ID in [tool.flet.android.meta_data] (com.google.android.gms.ads.APPLICATION_ID)."
            fail=1
          fi
          if grep -q "USE_TEST_IDS *= *True" src/services/ad_service.py 2>/dev/null; then
            echo "::error::AdService.USE_TEST_IDS=True would serve test ads on a release tag."
            fail=1
          fi
          # PROD units must be filled (blank = AdService falls back to test IDs).
          for unit in ADMOB_APP_ID_PROD ADMOB_BANNER_UNIT_PROD ADMOB_INTERSTITIAL_UNIT_PROD; do
            val=$(grep -oP "^${unit} *= *\"\K[^\"]+" src/core/constants.py || true)
            if [ -z "$val" ]; then
              echo "::error::$unit is blank in src/core/constants.py — prod ads cannot serve."
              fail=1
            fi
            case "$val" in
              *3940256099942544*) echo "::error::$unit holds a Google test ID."; fail=1;;
            esac
          done
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            exit $fail
          elif [[ "$fail" == "1" ]]; then
            echo "::warning::AdMob production-ID problem (expected for PR builds only if test IDs are in use)"
          fi

  # ─── 0. Create Release Tag & Placeholder ───────────────
  prepare-release:
    needs: [quality]
    runs-on: ubuntu-latest
    outputs:
      TAG_NAME: ${{ steps.tag_info.outputs.TAG_NAME }}
      RELEASE_NAME: ${{ steps.tag_info.outputs.RELEASE_NAME }}
      IS_PRERELEASE: ${{ steps.tag_info.outputs.IS_PRERELEASE }}
      MAKE_LATEST: ${{ steps.tag_info.outputs.MAKE_LATEST }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate Release Tag & Name
        id: tag_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "RELEASE_NAME=FFmpeg Lite ${{ github.ref_name }} (pre-release, pending approval)" >> $GITHUB_OUTPUT
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
            echo "MAKE_LATEST=false" >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            echo "TAG_NAME=build-${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "RELEASE_NAME=Automated Build (${SHORT_SHA})" >> $GITHUB_OUTPUT
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
            echo "MAKE_LATEST=false" >> $GITHUB_OUTPUT
          fi
      - name: Create GitHub Release Placeholder
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.TAG_NAME }}
          name: ${{ steps.tag_info.outputs.RELEASE_NAME }}
          prerelease: ${{ steps.tag_info.outputs.IS_PRERELEASE }}
          make_latest: ${{ steps.tag_info.outputs.MAKE_LATEST }}
          body: |
            Automated multi-platform build generated from commit `${{ github.sha }}`.

            *On-device media studio powered by FFmpeg 8 via PyAV.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Android APK (split per ABI) ───────────────────────
  build-apk-split:
    needs: [prepare-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Pre-compile mobile wheels (PyAV and extensions)
        run: |
          set -euo pipefail
          python -m pip install --upgrade wheel
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file requirements.mobile.txt
          python -m pip wheel -r requirements.mobile.txt --no-deps -w ${{ github.workspace }}/wheels
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > kiri_keystore.jks
      - name: Build APK (split per ABI)
        env:
          PIP_FIND_LINKS: ${{ github.workspace }}/wheels
          FLET_ANDROID_SIGNING_KEY_STORE: ${{ github.workspace }}/kiri_keystore.jks
          FLET_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: uv run --frozen flet build apk --python-version 3.14 --yes --project ffmpeg --product "FFmpeg Lite" --org ng.kiri --company "Kiri Research Labs" --build-version ${{ env.BUILD_VERSION }} --build-number ${{ env.BUILD_NUMBER }} --split-per-abi -v
      - name: Verify APK artifacts and prune boundary
        if: always()
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(build/apk/*.apk)
          test "${#artifacts[@]}" -gt 0
          ls -lh build/apk/*.apk
          for artifact in "${artifacts[@]}"; do
            if unzip -l "$artifact" | grep -qE 'pytest/|ruff/|uvicorn/|starlette/|fastapi/|docs/|screenshots/'; then
              echo "Development-only files found in $artifact"
              exit 1
            fi
          done
      - name: Upload directly to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.TAG_NAME }}
          files: build/apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Android AAB (Play Store) ───────────────────────────
  build-aab:
    needs: [prepare-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Pre-compile mobile wheels (PyAV and extensions)
        run: |
          set -euo pipefail
          python -m pip install --upgrade wheel
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file requirements.mobile.txt
          python -m pip wheel -r requirements.mobile.txt --no-deps -w ${{ github.workspace }}/wheels
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > kiri_keystore.jks
      - name: Build AAB
        env:
          PIP_FIND_LINKS: ${{ github.workspace }}/wheels
          FLET_ANDROID_SIGNING_KEY_STORE: ${{ github.workspace }}/kiri_keystore.jks
          FLET_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: uv run --frozen flet build aab --python-version 3.14 --yes --project ffmpeg --product "FFmpeg Lite" --org ng.kiri --company "Kiri Research Labs" --build-version ${{ env.BUILD_VERSION }} --build-number ${{ env.BUILD_NUMBER }} -v
      - name: Verify AAB artifact and prune boundary
        if: always()
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(build/aab/*.aab)
          test "${#artifacts[@]}" -gt 0
          ls -lh build/aab/*.aab
          for artifact in "${artifacts[@]}"; do
            if unzip -l "$artifact" | grep -qE 'pytest/|ruff/|uvicorn/|starlette/|fastapi/|docs/|screenshots/'; then
              echo "Development-only files found in $artifact"
              exit 1
            fi
          done
      - name: Inspect AAB manifest (minSdk/targetSdk/versionCode/AdMob)
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(build/aab/*.aab)
          test "${#artifacts[@]}" -gt 0
          aab="${artifacts[0]}"
          rm -rf /tmp/aab_inspect && mkdir -p /tmp/aab_inspect
          cd /tmp/aab_inspect
          # bundletool ships on ubuntu-latest runners via Android cmdline-tools;
          # fall back to aapt dump badging when it is absent (no new deps).
          if command -v bundletool >/dev/null 2>&1; then
            bundletool dump manifest --bundle "$GITHUB_WORKSPACE/$aab" --xpath /manifest > manifest.xml
          else
            "$ANDROID_HOME/build-tools/"*/aapt dump xmltree "$GITHUB_WORKSPACE/$aab" AndroidManifest.xml > manifest.txt
          fi
          echo "--- manifest head ---"
          head -n 40 manifest.* | head -n 40
          # minSdk floor: av's Android wheels are built at ABI 24.
          if grep -q "minSdkVersion" manifest.*; then
            minsdk=$(grep -o 'minSdkVersion[^0-9]*[0-9]\+' manifest.* | grep -o '[0-9]\+' | head -1)
            if [ "${minsdk:-0}" -lt 24 ]; then echo "::error::minSdkVersion $minsdk < 24 (av ABI floor)"; exit 1; fi
            echo "minSdkVersion=$minsdk OK"
          else
            echo "::warning::minSdkVersion not found in manifest dump — verify manually before upload"
          fi
          # versionCode must track the release build number.
          if grep -q "versionCode" manifest.*; then
            vcode=$(grep -o 'versionCode[^0-9]*[0-9]\+' manifest.* | grep -o '[0-9]\+' | head -1)
            if [ "${vcode:-0}" != "${{ env.BUILD_NUMBER }}" ]; then echo "::error::versionCode $vcode != BUILD_NUMBER ${{ env.BUILD_NUMBER }}"; exit 1; fi
            echo "versionCode=$vcode OK"
          else
            echo "::warning::versionCode not found in manifest dump — verify manually before upload"
          fi
          # Production AdMob App ID must be the merged manifest value.
          if grep -q "5679949845754640~8554716742" manifest.*; then
            echo "AdMob APPLICATION_ID (prod) OK"
          else
            echo "::error::Production AdMob App ID missing from merged manifest"
            exit 1
          fi
          # usesCleartextTraffic is informational: http:// capture depends on
          # the platform default, so record whatever the template produced.
          if grep -q "usesCleartextTraffic" manifest.*; then
            grep -o 'usesCleartextTraffic[^ ]*' manifest.* | head -1
          else
            echo "usesCleartextTraffic unset (platform default applies to http:// capture)"
          fi
      - name: Upload directly to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.TAG_NAME }}
          files: build/aab/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Windows (Automated .exe Setup Installer) ──────────────
  build-windows:
    needs: [prepare-release]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Build Windows Portable
        run: uv run --frozen flet build windows --python-version 3.14 --yes --project ffmpeg --product "FFmpeg Lite" --org ng.kiri --company "Kiri Research Labs" --build-version ${{ env.BUILD_VERSION }} --build-number ${{ env.BUILD_NUMBER }} -v

      - name: Generate Icon for Installer
        run: |
          uv pip install pillow
          uv run python -c "from PIL import Image; Image.open('src/assets/icon.png').save('src/assets/icon.ico', format='ICO', sizes=[(256, 256)])"

      - name: Build Windows Installer (Inno Setup)
        run: |
          $IssContent = @"
          [Setup]
          AppId={{9A4F2C1B-7E63-4D08-B2A5-6C1E8F0D4A71}}
          AppName=FFmpeg Lite
          AppVersion=${{ env.BUILD_VERSION }}
          AppPublisher=Kiri Research Labs
          AppPublisherURL=https://kiri.ng
          AppSupportURL=https://kiri.ng/support
          AppUpdatesURL=https://kiri.ng/updates
          AppCopyright=Copyright (C) 2026 Kiri Research Labs
          DefaultDirName={autopf}\FFmpeg Lite
          DefaultGroupName=FFmpeg Lite
          OutputDir=.\build\installer
          OutputBaseFilename=FFmpeg_Lite
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          ArchitecturesAllowed=x64
          ArchitecturesInstallIn64BitMode=x64
          PrivilegesRequired=lowest
          SetupIconFile=.\src\assets\icon.ico
          UninstallDisplayIcon={app}\ffmpeg.exe
          CloseApplications=yes
          AppMutex=FFMPEG_Mutex

          [Files]
          Source: "build\windows\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\FFmpeg Lite"; Filename: "{app}\ffmpeg.exe"
          Name: "{autodesktop}\FFmpeg Lite"; Filename: "{app}\ffmpeg.exe"; Tasks: desktopicon

          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional icons:"; Flags: unchecked
          "@
          Set-Content -Path "installer.iss" -Value $IssContent -Encoding UTF8
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload directly to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.TAG_NAME }}
          files: build/installer/FFmpeg_Lite.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Linux (.deb, .rpm & Universal .tar.gz) ────────────────
  build-linux:
    needs: [prepare-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install Linux Build Dependencies & Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libmpv-dev libmpv2 rpm ruby ruby-dev
          sudo gem install --no-document fpm
      - name: Build Linux Bundle
        run: uv run --frozen flet build linux --python-version 3.14 --yes --project ffmpeg --product "FFmpeg Lite" --org ng.kiri --company "Kiri Research Labs" --build-version ${{ env.BUILD_VERSION }} --build-number ${{ env.BUILD_NUMBER }} -v
      - name: Create Linux Packages (.deb, .rpm, .tar.gz)
        run: |
          mkdir -p build/dist

          # 1. Universal Portable .tar.gz
          tar -czf build/dist/FFmpeg_Lite.tar.gz -C build/linux .

          # 2. Stage filesystem tree for rich .deb and .rpm packages
          mkdir -p pkg_root/usr/lib/ffmpeg pkg_root/usr/bin pkg_root/usr/share/applications pkg_root/usr/share/icons/hicolor/256x256/apps pkg_root/usr/share/pixmaps pkg_root/usr/share/metainfo
          cp -a build/linux/* pkg_root/usr/lib/ffmpeg/
          chmod +x pkg_root/usr/lib/ffmpeg/ffmpeg
          ln -s /usr/lib/ffmpeg/ffmpeg pkg_root/usr/bin/ffmpeg

          # Icons
          cp src/assets/icon.png pkg_root/usr/share/icons/hicolor/256x256/apps/ffmpeg.png
          cp src/assets/icon.png pkg_root/usr/share/pixmaps/ffmpeg.png

          # Desktop entry
          cat <<EOF > pkg_root/usr/share/applications/ffmpeg.desktop
          [Desktop Entry]
          Version=1.0
          Name=FFmpeg Lite
          GenericName=On-Device Media Toolkit
          Comment=Transcode, compress, cut, extract and filter any media on-device — powered by FFmpeg 8 via PyAV
          Exec=/usr/bin/ffmpeg
          Icon=ffmpeg
          Terminal=false
          Type=Application
          Categories=AudioVideo;Video;Audio;
          Keywords=media;video;audio;transcode;convert;compress;FFmpeg;
          StartupNotify=true
          StartupWMClass=ffmpeg
          EOF

          # AppStream / AppData metainfo XML
          cat <<EOF > pkg_root/usr/share/metainfo/ng.kiri.ffmpeg.metainfo.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <component type="desktop-application">
            <id>ng.kiri.ffmpeg</id>
            <metadata_license>MIT</metadata_license>
            <project_license>MIT</project_license>
            <name>FFmpeg Lite</name>
            <summary>On-device media toolkit — transcode, compress, cut and extract any media with FFmpeg 8</summary>
            <description>
              <p>FFmpeg Lite is an on-device media studio powered by FFmpeg 8 via PyAV:</p>
              <ul>
                <li>Transcode and compress video/audio with quality presets and target-size control</li>
                <li>Cut/trim with stream-copy (instant) or frame-accurate re-encode</li>
                <li>Extract audio, frames, thumbnails and palette-optimized GIFs</li>
                <li>Batch jobs, live-stream record, media dossier and share-sheet output</li>
              </ul>
            </description>
            <launchable type="desktop-id">ffmpeg.desktop</launchable>
            <url type="homepage">https://kiri.ng</url>
            <developer_name>Kiri Research Labs</developer_name>
          </component>
          EOF

          # Build rich .deb using fpm
          fpm -s dir -t deb -n ffmpeg -v ${{ env.BUILD_VERSION }} --iteration ${{ env.BUILD_NUMBER }} \
              --architecture amd64 \
              --description "On-device media toolkit — transcode, compress, cut and extract any media with FFmpeg 8." \
              --maintainer "Kiri Research Labs <support@kiri.ng>" \
              --url "https://kiri.ng" \
              --category "video" \
              -p build/dist/FFmpeg_Lite.deb \
              -C pkg_root .

          # Build rich .rpm using fpm
          fpm -s dir -t rpm -n ffmpeg -v ${{ env.BUILD_VERSION }} --iteration ${{ env.BUILD_NUMBER }} \
              --architecture x86_64 \
              --description "On-device media toolkit — transcode, compress, cut and extract any media with FFmpeg 8." \
              --maintainer "Kiri Research Labs <support@kiri.ng>" \
              --url "https://kiri.ng" \
              --category "Utility" \
              -p build/dist/FFmpeg_Lite.rpm \
              -C pkg_root .

      - name: Upload directly to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.TAG_NAME }}
          files: build/dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
